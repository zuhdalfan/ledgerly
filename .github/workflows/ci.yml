name: CI

on:
  push:
    branches: [main]
  pull_request:
  # So a run can be started by hand from the Actions tab or `gh workflow run`.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      # The promise this product makes: no network, ever. This fails the build
      # if an HTTP client, a browser networking API, or a remote URL appears.
      - name: Offline check
        run: npm run check:offline

      # An MIT binary carries its dependencies' licences, so a copyleft crate
      # creeping in is a release blocker rather than a style question.
      - name: Licence check
        run: npm run check:licenses

      # Measures every foreground/background pair the UI renders, so the
      # contrast claim is a check rather than an opinion.
      - name: Contrast check
        run: npm run check:contrast

      - name: Frontend typecheck
        run: npm run check

      - name: Frontend build
        run: npm run build

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Rust lint
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # The MCP sidecar is a second binary; build it so it cannot silently rot.
      - name: Build the MCP sidecar
        run: cargo build --manifest-path src-tauri/Cargo.toml --bin ledgerly-mcp
