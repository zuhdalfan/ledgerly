[package]
name = "ledgerly"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ledgerly_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
uuid = { version = "1.27.0", features = ["v7"] }
rust_decimal = "1.43.0"
printpdf = "0.7"
tauri-plugin-dialog = "2.8.1"
ttf-parser = "0.25.1"
zip = { version = "9.0.0", default-features = false, features = ["deflate"] }
ed25519-dalek = "3.0.0"
sha2 = "0.11.0"
base32 = "0.5.1"
aes-gcm = "0.11.1"
keyring = { version = "4.2.0", features = ["apple-native-keyring-store"] }
getrandom = "0.4.3"
machine-uid = "0.6.0"
ledgerly-license = { path = "../licensing-format" }
argon2 = "0.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
lopdf = "0.45.0"
